{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Where to go?{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'places/style.css' %}">
    </head>
    <body>
        <header class="site-header">
            <a class="brand" href="{% url 'places:home' %}">Where to go?</a>
            <nav aria-label="Main navigation">
                <a href="{% url 'places:home' %}">Home</a>
                <a href="{% url 'places:places' %}">All places</a>
                <a href="{% url 'places:add_place' %}">Add new place</a>
            </nav>
        </header>
        <main class="page">
            {% block content %}{% endblock %}
        </main>
        <footer>
            <p>© September 2026 — Created by Julia Sakharova</p>
        </footer>
    </body>
</html>
